name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:DISPATCH_TAG
          } else {
            $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like v1.2.3 (received '$tag')."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: parser/requirements-release.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install parser dependencies
        run: python -m pip install -r parser/requirements-release.txt

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $expected = $env:RELEASE_TAG.Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lockVersion = (node -p "require('./package-lock.json').version").Trim()
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if (
            $packageVersion -ne $expected -or
            $lockVersion -ne $expected -or
            $tauriVersion -ne $expected -or
            $cargoVersion -ne $expected
          ) {
            throw "Tag $env:RELEASE_TAG does not match package ($packageVersion), lockfile ($lockVersion), Tauri ($tauriVersion), and Cargo ($cargoVersion) versions."
          }

      - name: Build frontend
        run: npm run build

      - name: Test parser
        run: npm run test:parser

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Rust application
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build standalone parser helpers
        shell: pwsh
        run: ./tools/build_parser_helpers.ps1 -Clean

      - name: Build installers and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: PhiReader ${{ steps.release.outputs.tag }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
