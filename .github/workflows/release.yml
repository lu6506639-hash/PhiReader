name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:DISPATCH_TAG
          } else {
            $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like v1.2.3 (received '$tag')."
          }
          $prerelease = $tag.Contains('-')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "channel=$(if ($prerelease) { 'beta' } else { 'stable' })" >> $env:GITHUB_OUTPUT

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: parser/requirements-release.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install parser dependencies
        run: python -m pip install -r parser/requirements-release.txt

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $expected = $env:RELEASE_TAG.Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lockVersion = (node -p "require('./package-lock.json').version").Trim()
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if (
            $packageVersion -ne $expected -or
            $lockVersion -ne $expected -or
            $tauriVersion -ne $expected -or
            $cargoVersion -ne $expected
          ) {
            throw "Tag $env:RELEASE_TAG does not match package ($packageVersion), lockfile ($lockVersion), Tauri ($tauriVersion), and Cargo ($cargoVersion) versions."
          }

      - name: Configure beta update channel
        if: steps.release.outputs.channel == 'beta'
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.plugins.updater.endpoints = @(
            "https://github.com/$env:GITHUB_REPOSITORY/releases/download/beta/latest.json"
          )
          $config | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding utf8

      - name: Build frontend
        run: npm run build

      - name: Test parser
        run: npm run test:parser

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Rust application
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build standalone parser helpers
        shell: pwsh
        run: ./tools/build_parser_helpers.ps1 -Clean

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY is required to publish signed updates."
          }

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $notes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:RELEASE_TAG" | ConvertFrom-Json
          $delimiter = [guid]::NewGuid().ToString()
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $notes.body >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Build installers and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: PhiReader ${{ steps.release.outputs.tag }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Update beta channel manifest
        if: steps.release.outputs.channel == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "phireader-beta-manifest"
          New-Item -ItemType Directory -Force $downloadDir | Out-Null
          gh release download $env:RELEASE_TAG --pattern latest.json --dir $downloadDir
          gh release view beta *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create beta --prerelease --target $env:GITHUB_SHA --title "PhiReader Beta Update Channel" --notes "Machine-managed update manifest for PhiReader beta builds."
          }
          gh release upload beta (Join-Path $downloadDir "latest.json") --clobber
